[project]
# Distribution name. Releases ≤ 0.5.0 were published as `rtl-buddy-view`;
# the repo rename to rtl-buddy-sch broke that project's PyPI trusted
# publisher (OIDC claims carry the repo name), so the distribution now
# follows the repo. The `rtl-buddy-view` console script, `tool.name`
# stamp, view.json artefact, and import package `rtl_buddy_view` are
# frozen consumer contracts and keep their names.
name = "rtl-buddy-sch"
dynamic = ["version"]
description = "RTL hierarchy and connectivity visualization tool. Pluggable Verible (source CST) or slang (elaborated) frontend; renders Graphviz / ASCII / Mermaid / JSON; integrates with rtl-buddy."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Loh Zhi-Hern", email = "expsg-hern@users.noreply.github.com" }
]
dependencies = [
    "typer>=0.25.1",
    # JSON Schema validator for view.json v1 (#17). Lightweight,
    # widely used, and required by the contract test so the schema
    # file under schemas/ stays a live constraint rather than docs.
    "jsonschema>=4.21.0",
]

[project.optional-dependencies]
# Opt-in elaboration frontend. Installs pyslang so the `slang` frontend
# can elaborate SystemVerilog in-process — needed to resolve generates
# and parameterized instances that the source-level Verible frontend
# cannot. Default install stays typer-only; the Verible binary is
# fetched separately by the setup flow, not pulled in via pip.
slang = [
    "pyslang>=10,<11",
]

[project.scripts]
# `rtl-buddy-view` is the PATH contract rtl_buddy resolves (tool_manifest
# + tools/hier_rtl_buddy_view.py); it must survive the distribution
# rename. `rtl-buddy-sch` is the forward-looking alias.
rtl-buddy-view = "rtl_buddy_view:main"
rtl-buddy-sch = "rtl_buddy_view:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Version is derived from the git tag at build time (no static string in
# this file), matching rtl_buddy. A release is cut by the label-driven
# Release workflow, which computes + pushes the vX.Y.Z tag and builds
# from it. The JSON renderer reads the result via
# importlib.metadata.version("rtl-buddy-sch") at runtime (with a
# fallback probe of the pre-rename "rtl-buddy-view" dist).
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/rtl_buddy_view"]
# The compiled Vue SPA staged by scripts/prebuild_viewer.py lives at
# src/rtl_buddy_view/_viewer_bundle/ and is VCS-ignored (.gitignore).
# hatchling drops VCS-ignored files by default, so name the bundle as a
# build artifact to force it into the wheel — without this the hub would
# 404 on a missing SPA. The Wheel CI guard asserts index.html + a JS
# asset are present.
artifacts = ["src/rtl_buddy_view/_viewer_bundle/**"]

[dependency-groups]
lint = [
    "mypy>=2.1.0",
    "ruff>=0.11.0",
]
test = [
    "coverage>=7.14.0",
    # graph.json's envelope claims to be NetworkX node-link JSON (which
    # is what makes it Graphify-compatible). Test-only: the exporter
    # never imports networkx, it just has to satisfy its reader.
    "networkx>=3.3",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["F", "E7", "E9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Auto-runs coverage on every `pytest` invocation. The fail-under
# gate enforces Phase 1's acceptance criterion (#1) — ≥80% line
# coverage across the analyzer, dominated by the three core
# modules (frontend/verible.py, extractor.py, graph.py) which sit
# well above the threshold today. The per-file breakdown stays in
# the report so a regression in any single file surfaces at PR
# review time.
addopts = [
    "--cov=src/rtl_buddy_view",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]

[tool.coverage.run]
branch = false
source = ["src/rtl_buddy_view"]

[tool.coverage.report]
# Don't count clearly-unreachable lines against the threshold. We
# stay narrow here on purpose — every exclusion is a tiny erosion
# of the gate's bite; only suppress patterns that are factually
# unreachable in tests, not "tedious to cover".
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.11"
files = ["src/rtl_buddy_view"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyslang.*"
ignore_missing_imports = true
follow_imports = "skip"
