name: Release

# Publish rtl-buddy-view to PyPI on a version tag.
#
# rtl-buddy-view carries a *static* version in pyproject.toml, and its
# wheel embeds the compiled Vue SPA (staged by scripts/prebuild_viewer.py),
# so a release is: build the SPA -> uv build --wheel -> publish. These
# build steps mirror wheel.yml, which already runs them green on every
# push to main; this workflow adds the version-tag trigger, a tag/version
# consistency guard, and the PyPI upload.
#
# The wheel is universal (py3-none-any), so a single wheel covers every
# platform and we publish wheel-only. We deliberately do NOT ship an
# sdist: an sdist built without the npm prebuild would omit the SPA
# bundle, and pip cannot run the npm build at install time.
#
# Publishing uses PyPI Trusted Publishing (OIDC) -- no API token. Before
# the first run, configure a trusted publisher for this project on PyPI
# (https://docs.pypi.org/trusted-publishers/) with:
#     owner:        rtl-buddy
#     repository:   rtl-buddy-view
#     workflow:     release.yml
#     environment:  pypi
# Until the project exists on PyPI, register it as a "pending publisher".
# The `pypi` GitHub environment below must also exist on the repo.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or ref to build and publish (e.g. v0.2.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Assert ref matches pyproject version
        # The version is static in pyproject.toml, so whatever ref we
        # build -- the pushed tag, or the ref handed to a manual
        # dispatch -- must agree with it, or PyPI gets a wheel whose
        # version disagrees with the ref that produced it (and rejects a
        # duplicate version late). Runs for BOTH triggers; uv's project
        # python guarantees tomllib (>=3.11) regardless of the runner.
        # Fails fast here, before the expensive npm/SPA build.
        env:
          DISPATCH_REF: ${{ github.event.inputs.ref }}
        run: |
          proj=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            ref_name="$DISPATCH_REF"
          else
            ref_name="$GITHUB_REF_NAME"
          fi
          version="${ref_name#v}"
          echo "pyproject=$proj ref=$ref_name -> expected=$version"
          if [ "$proj" != "$version" ]; then
            echo "::error::ref '$ref_name' does not match pyproject version '$proj' -- publish from a vX.Y.Z tag/ref matching pyproject"
            exit 1
          fi

      - name: Build SPA bundle
        # Canonical pre-build step: npm ci && npm run build in viewer/,
        # then stage the bundle into src/rtl_buddy_view/_viewer_bundle/.
        run: uv run python scripts/prebuild_viewer.py

      - name: Build wheel
        run: uv build --wheel

      - name: Verify bundle is in the wheel
        # Same guard wheel.yml uses: never publish a wheel that the hub
        # would then 404 on for a missing SPA.
        run: |
          wheel=$(ls dist/rtl_buddy_view-*.whl)
          echo "Built: $wheel"
          if ! unzip -l "$wheel" | grep -q 'rtl_buddy_view/_viewer_bundle/index.html'; then
            echo "::error::wheel is missing _viewer_bundle/index.html"
            unzip -l "$wheel"
            exit 1
          fi
          if ! unzip -l "$wheel" | grep -q 'rtl_buddy_view/_viewer_bundle/assets/.*\.js$'; then
            echo "::error::wheel ships index.html but no JS bundle"
            unzip -l "$wheel"
            exit 1
          fi

      - name: Upload wheel artefact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rtl-buddy-view
    permissions:
      id-token: write # OIDC token for trusted publishing
    steps:
      - name: Download wheel artefact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
