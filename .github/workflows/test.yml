name: Test


# One live run per workflow per branch: a force-push (routine in this
# repo's stacked-PR flow) supersedes the previous head, and without a
# concurrency group the superseded run keeps a runner until it
# finishes — or, as on rtl-buddy-sch#182, until a wedged step is
# noticed an hour later. head_ref covers pull_request events (where
# github.ref is the synthetic merge ref); bare ref covers push.
# release.yml manages its own group and is deliberately untouched.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'scripts/**/*.py'
      - 'tests/fixtures/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/test.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'scripts/**/*.py'
      - 'tests/fixtures/**'

jobs:
  pytest:
    name: pytest — py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install test dependencies
        run: uv sync --group test --python ${{ matrix.python-version }}

      # The verible-dependent integration tests skip when the binary
      # isn't on PATH or in vendor/. Without them, the coverage gate
      # in pyproject.toml (--cov-fail-under=80) won't hold, since the
      # CST walker in frontend/verible.py wouldn't be exercised.
      # Cache the vendored binary keyed on the pinned-version constant
      # so we pay the download cost once per version bump, not once
      # per CI run.
      - name: Cache vendored Verible
        id: cache-verible
        uses: actions/cache@v4
        with:
          path: vendor/verible
          key: verible-${{ runner.os }}-${{ hashFiles('src/rtl_buddy_view/_verible_install.py') }}

      - name: Fetch Verible (cache miss only)
        if: steps.cache-verible.outputs.cache-hit != 'true'
        run: uv run python scripts/fetch_verible.py

      - name: Run pytest
        run: uv run pytest -q
