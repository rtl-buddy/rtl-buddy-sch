name: Lint


# One live run per workflow per branch: a force-push (routine in this
# repo's stacked-PR flow) supersedes the previous head, and without a
# concurrency group the superseded run keeps a runner until it
# finishes — or, as on rtl-buddy-sch#182, until a wedged step is
# noticed an hour later. head_ref covers pull_request events (where
# github.ref is the synthetic merge ref); bare ref covers push.
# release.yml manages its own group and is deliberately untouched.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lint.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'src/**/*.py'
      - 'tests/**/*.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lint.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'src/**/*.py'
      - 'tests/**/*.py'

jobs:
  ruff-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install lint dependencies
        run: uv sync --group lint

      - name: Run Ruff
        run: uv run ruff check

      - name: Check Ruff formatting
        run: uv run ruff format --check

      - name: Hint — install pre-commit to catch this locally
        if: failure()
        run: |
          echo ""
          echo "Ruff check or format failed. Catch this before pushing by installing the pre-commit hook:"
          echo ""
          echo "  uv tool install pre-commit"
          echo "  pre-commit install"
          echo ""
          echo "After that, every commit will run Ruff automatically."

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install lint dependencies
        run: uv sync --group lint

      - name: Run mypy
        run: uv run mypy
